onboarding = false

[theme]
name = "terminal"
auto_switch = false

[keys]
prefix = "ctrl+space"
toggle_sidebar = "prefix+s"
split_vertical = "prefix+|"
split_horizontal = "prefix+-"
detach = "prefix+d"
new_tab = "prefix+n"
switch_workspace = "prefix+shift+1..9"

[ui]
agent_panel_sort = "spaces"

[session]
resume_agents_on_restore = false
